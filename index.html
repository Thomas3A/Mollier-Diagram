<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mollier h,x-diagram</title>
    <meta name="description" content="Interactief Mollier h,x-diagram en psychrometrisch diagram: luchtbehandelingsprocessen, vermogens en waterdebieten volgens ASHRAE 2017.">
    <meta name="theme-color" content="#059669">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23059669'/%3E%3Cpath d='M7 25C12 23 19 17 25 7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M7 25 7 7M7 25 25 25' stroke='%23a7f3d0' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/ewf.css">
    <script>
        // Thema en huisstijl vóór de eerste render zetten (geen flits)
        try {
            var pr = JSON.parse(localStorage.getItem('mollier.prefs') || '{}');
            if (pr.theme === 'light' || pr.theme === 'dark') document.documentElement.setAttribute('data-theme', pr.theme);
            if (pr.brand === 'ikea') document.documentElement.setAttribute('data-brand', 'ikea');
        } catch (e) { /* geen opslag beschikbaar */ }
    </script>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
            <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
            <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
            <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
            <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
            <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><path d="M12 17.5h.01"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
            <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></symbol>
            <symbol id="i-full" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 15c5-1 10-5 13-11"/></symbol>
            <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
            <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
            <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
            <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
            <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
            <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
            <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></symbol>
            <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
            <!-- Procescategorieën -->
            <symbol id="c-heat" viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2.5 1.2-3.8 2.3-5 .4 1.5 1.2 2.5 2.2 3C11 8 11 5.5 12 3z"/></symbol>
            <symbol id="c-cool" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2M4 10.5l3.5-.2L6 7M20 13.5l-3.5.2L18 17M4 13.5l3.5.2L6 17M20 10.5l-3.5-.2L18 7"/></symbol>
            <symbol id="c-humidify" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M12 11v6M9 14h6"/></symbol>
            <symbol id="c-dehumidify" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9 14h6"/></symbol>
            <symbol id="c-mix" viewBox="0 0 24 24"><path d="M4 5h4l8 14h4M4 19h4l3-5.2M13 10.2 16 5h4"/><path d="m18 3 2 2-2 2M18 17l2 2-2 2"/></symbol>
            <symbol id="c-hr" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/><rect x="9" y="10" width="6" height="4" rx="1"/></symbol>
            <symbol id="c-ewf" viewBox="0 0 24 24"><path d="M5 3h14M8 3v18M16 3v18"/><path d="M11 7v2M13 10v2M11 13v2M13 16v2"/></symbol>
            <symbol id="c-other" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></symbol>
        </defs>
    </svg>

    <header class="topbar">
        <div class="brand">
            <!-- Logo van de verborgen huisstijl (easter egg) -->
            <svg class="logo-ikea" viewBox="0 0 120 40" aria-hidden="true"><rect width="120" height="40" fill="#0058a3"/><ellipse cx="60" cy="20" rx="56.5" ry="16.5" fill="#ffdb00"/><text x="60" y="27.4" text-anchor="middle" textLength="94" lengthAdjust="spacingAndGlyphs" fill="#0058a3" font-family="Jost, Futura, 'Century Gothic', 'Trebuchet MS', sans-serif" font-weight="800" font-size="21">MÖLLIER</text></svg>
            <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path class="logo-grid" d="M8 24V8M8 24h16"/><path class="logo-curve" d="M8 24c5-2 11-7 16-16"/><path class="logo-curve2" d="M8 24c7-1 12-4 16-9"/></svg>
            <div class="brand-text">
                <h1 data-i18n="app.title">Mollier h,x-diagram</h1>
                <span data-i18n="app.subtitle">Luchtbehandeling · processen · belastingen</span>
            </div>
        </div>
        <input id="project-name" class="project-name" spellcheck="false" data-i18n-aria="tb.projectName">
        <nav class="toolbar">
            <div class="seg view-switch" id="view-switch" role="tablist" data-i18n-aria="view.label">
                <button type="button" role="tab" data-view="mollier" data-i18n="view.mollier">Mollier-diagram</button>
                <button type="button" role="tab" data-view="ewf" data-i18n="view.ewf">Earth, Wind &amp; Fire</button>
            </div>
            <div class="seg" id="chart-type" role="tablist">
                <button type="button" data-type="mollier" data-i18n="chartType.mollier">Mollier h,x</button>
                <button type="button" data-type="psychro" data-i18n="chartType.psychro">Psychrometrisch</button>
            </div>
            <span class="tb-sep"></span>
            <button type="button" class="icon-btn" id="btn-undo" data-i18n-title="tb.undo"><svg><use href="#i-undo"/></svg></button>
            <button type="button" class="icon-btn" id="btn-redo" data-i18n-title="tb.redo"><svg><use href="#i-redo"/></svg></button>
            <div class="menu" id="menu-file">
                <button type="button" class="tb-btn" id="btn-file" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-file"/></svg><span data-i18n="tb.file">Bestand</span></button>
                <div class="menu-pop" role="menu">
                    <button type="button" data-action="new" data-i18n="menu.new"></button>
                    <button type="button" data-action="example" data-i18n="menu.example"></button>
                    <button type="button" data-action="open" data-i18n="menu.open"></button>
                    <button type="button" data-action="save" data-i18n="menu.save"></button>
                    <hr>
                    <button type="button" data-action="png" data-i18n="menu.png"></button>
                    <button type="button" data-action="svg" data-i18n="menu.svg"></button>
                    <button type="button" data-action="csv" data-i18n="menu.csv"></button>
                    <button type="button" data-action="print" data-i18n="menu.print"></button>
                </div>
            </div>
            <button type="button" class="tb-btn" id="btn-share"><svg><use href="#i-share"/></svg><span data-i18n="tb.share">Delen</span></button>
            <span class="tb-sep"></span>
            <button type="button" class="icon-btn lang-btn" id="btn-lang" data-i18n-title="tb.lang">EN</button>
            <button type="button" class="icon-btn" id="btn-theme" data-i18n-title="tb.theme"><svg><use href="#i-moon"/></svg></button>
            <button type="button" class="icon-btn" id="btn-help" data-i18n-title="tb.help"><svg><use href="#i-help"/></svg></button>
        </nav>
    </header>

    <main class="layout" id="view-mollier">
        <aside class="sidebar">
            <!-- Scenario's -->
            <section class="panel">
                <div class="panel-head">
                    <h2 data-i18n="panel.scenarios">Scenario's</h2>
                    <button type="button" class="chip-btn" id="btn-scn-add"><svg><use href="#i-plus"/></svg><span data-i18n="scn.add">Nieuw</span></button>
                </div>
                <div class="scn-tabs" id="scn-tabs" role="tablist"></div>
                <div class="scn-edit">
                    <input id="scn-name" class="input" spellcheck="false" data-i18n-aria="scn.name">
                    <div class="swatches" id="scn-colors" data-i18n-aria="scn.color"></div>
                    <button type="button" class="icon-btn sm" id="btn-scn-visible" data-i18n-title="scn.visible"><svg><use href="#i-eye"/></svg></button>
                    <button type="button" class="icon-btn sm" id="btn-scn-dup" data-i18n-title="scn.duplicate"><svg><use href="#i-copy"/></svg></button>
                    <button type="button" class="icon-btn sm danger" id="btn-scn-del" data-i18n-title="scn.delete"><svg><use href="#i-x"/></svg></button>
                </div>
            </section>

            <!-- Beginpunt -->
            <section class="panel">
                <div class="panel-head"><h2 data-i18n="panel.start">Beginpunt &amp; luchtdebiet</h2><span class="pt-badge" id="start-badge">1</span></div>
                <label class="fld">
                    <span class="fld-lbl" data-i18n="start.pair">Invoer met</span>
                    <select id="start-pair" class="input"></select>
                </label>
                <div class="grid2">
                    <label class="fld"><span class="fld-lbl" id="start-a-lbl"></span><span class="input-unit"><input id="start-a" class="input" inputmode="decimal" autocomplete="off"><em id="start-a-unit"></em></span></label>
                    <label class="fld"><span class="fld-lbl" id="start-b-lbl"></span><span class="input-unit"><input id="start-b" class="input" inputmode="decimal" autocomplete="off"><em id="start-b-unit"></em></span></label>
                </div>
                <div class="state-strip" id="start-summary"></div>
                <div class="grid2">
                    <label class="fld"><span class="fld-lbl" data-i18n="start.flow">Luchtdebiet</span><input id="flow-value" class="input" inputmode="decimal" autocomplete="off"></label>
                    <label class="fld"><span class="fld-lbl">&nbsp;</span>
                        <select id="flow-mode" class="input">
                            <option value="volume" data-i18n="start.flowVolume"></option>
                            <option value="mass" data-i18n="start.flowMass"></option>
                        </select>
                    </label>
                </div>
                <p class="hint" id="flow-summary"></p>
            </section>

            <!-- Processtap toevoegen / bewerken -->
            <section class="panel" id="panel-form">
                <div class="panel-head"><h2 id="form-title" data-i18n="panel.add">Processtap toevoegen</h2></div>
                <div class="cat-grid" id="cat-grid" role="tablist"></div>
                <label class="fld" id="type-fld">
                    <span class="fld-lbl" data-i18n="form.process">Proces</span>
                    <select id="step-type" class="input"></select>
                </label>
                <p class="hint type-hint" id="type-hint"></p>
                <div id="step-fields" class="fields"></div>
                <div class="preview-box" id="step-preview" aria-live="polite"></div>
                <div class="btn-row">
                    <button type="button" class="btn primary" id="btn-step-submit" data-i18n="form.add">Toevoegen</button>
                    <button type="button" class="btn" id="btn-step-cancel" data-i18n="form.cancel" hidden>Annuleren</button>
                </div>
            </section>

            <!-- Processtappen -->
            <section class="panel">
                <div class="panel-head"><h2 data-i18n="panel.steps">Processtappen</h2><span class="count" id="step-count"></span></div>
                <ol class="step-list" id="step-list"></ol>
            </section>

            <!-- Systeem -->
            <section class="panel">
                <div class="panel-head"><h2 data-i18n="panel.system">Systeem</h2></div>
                <div class="grid2">
                    <label class="fld"><span class="fld-lbl" data-i18n="sys.pressureBy">Luchtdruk via</span>
                        <select id="p-mode" class="input">
                            <option value="altitude" data-i18n="sys.altitude">Hoogte</option>
                            <option value="pressure" data-i18n="sys.pressure">Druk</option>
                        </select>
                    </label>
                    <label class="fld"><span class="fld-lbl" id="p-lbl">&nbsp;</span><span class="input-unit"><input id="p-value" class="input" inputmode="decimal" autocomplete="off"><em id="p-unit">m</em></span></label>
                </div>
                <p class="hint" id="p-summary"></p>
            </section>
        </aside>

        <section class="content">
            <div class="kpis" id="kpis"></div>

            <div class="card chart-card">
                <div class="chart-head">
                    <div class="chart-title" id="chart-title"></div>
                    <div class="chart-tools">
                        <div class="menu" id="menu-range">
                            <button type="button" class="tb-btn sm" id="btn-range" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-sliders"/></svg><span data-i18n="chart.range">Bereik</span></button>
                            <div class="menu-pop wide" id="range-pop"></div>
                        </div>
                        <span class="tb-sep"></span>
                        <button type="button" class="icon-btn sm" id="btn-zoom-out" data-i18n-title="chart.zoomOut"><svg><use href="#i-minus"/></svg></button>
                        <button type="button" class="icon-btn sm" id="btn-zoom-in" data-i18n-title="chart.zoomIn"><svg><use href="#i-plus"/></svg></button>
                        <button type="button" class="icon-btn sm" id="btn-fit" data-i18n-title="chart.fit"><svg><use href="#i-fit"/></svg></button>
                        <button type="button" class="icon-btn sm" id="btn-reset" data-i18n-title="chart.reset"><svg><use href="#i-full"/></svg></button>
                    </div>
                </div>
                <div class="chart-wrap" id="chart-wrap">
                    <svg id="chart"></svg>
                    <div class="wheel-hint" id="wheel-hint" data-i18n="chart.wheelHint"></div>
                </div>
                <div class="statusbar" id="statusbar" aria-live="off"></div>
                <div class="chart-foot">
                    <div class="layer-chips" id="layer-chips"></div>
                    <p class="hint chart-hint" data-i18n="chart.hint"></p>
                </div>
            </div>

            <div class="card results">
                <div class="results-head">
                    <div class="tabs" role="tablist">
                        <button type="button" class="tab" data-tab="states" data-i18n="tbl.states">Toestanden</button>
                        <button type="button" class="tab" data-tab="steps" data-i18n="tbl.steps">Processen</button>
                    </div>
                    <span class="results-scn" id="results-scn"></span>
                    <button type="button" class="tb-btn sm" id="btn-csv"><svg><use href="#i-download"/></svg><span data-i18n="tbl.csv">CSV</span></button>
                </div>
                <div class="table-wrap">
                    <table class="data-table" id="tbl-states"></table>
                    <table class="data-table" id="tbl-steps" hidden></table>
                </div>
            </div>
        </section>
    </main>

    <!-- Earth, Wind & Fire (js/ewf/view.js bouwt de inhoud) -->
    <main class="layout ewf-layout" id="view-ewf" hidden>
        <aside class="sidebar ewf-sidebar" id="ewf-sidebar"></aside>
        <section class="content ewf-content" id="ewf-content"></section>
    </main>

    <footer class="footer"><span data-i18n="app.footer"></span> · <button type="button" class="egg" id="version" aria-pressed="false">v4.0</button></footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <dialog class="dialog" id="dlg-help">
        <div class="dialog-head"><h2 data-i18n="help.title">Help</h2><button type="button" class="icon-btn sm" data-close data-i18n-title="help.close"><svg><use href="#i-x"/></svg></button></div>
        <div class="dialog-body">
            <p data-i18n="help.intro"></p>
            <h3 data-i18n="help.mouse"></h3>
            <ul><li data-i18n="help.m1"></li><li data-i18n="help.m2"></li><li data-i18n="help.m3"></li><li data-i18n="help.m4"></li><li data-i18n="help.m5"></li></ul>
            <h3 data-i18n="help.keys"></h3>
            <ul><li data-i18n="help.k1"></li><li data-i18n="help.k2"></li><li data-i18n="help.k3"></li><li data-i18n="help.k4"></li><li data-i18n="help.k5"></li></ul>
            <h3 data-i18n="help.method"></h3>
            <ul><li data-i18n="help.me1"></li><li data-i18n="help.me2"></li><li data-i18n="help.me3"></li></ul>
            <h3 data-i18n="help.ewf"></h3>
            <ul><li data-i18n="help.ewf1"></li><li data-i18n="help.ewf2"></li><li data-i18n="help.ewf3"></li><li data-i18n="help.ewf4"></li><li data-i18n="help.ewf5"></li></ul>
        </div>
    </dialog>

    <input type="file" id="file-input" accept=".json,application/json" hidden>

    <script src="vendor/d3.min.js"></script>
    <script src="js/psychro.js"></script>
    <script src="js/ewf/physics.js"></script>
    <script src="js/processes.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/ewf/solar.js"></script>
    <script src="js/ewf/model.js"></script>
    <script src="js/ewf/weather.js"></script>
    <script src="js/ewf/schematic.js"></script>
    <script src="js/ewf/charts.js"></script>
    <script src="js/ewf/view.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
